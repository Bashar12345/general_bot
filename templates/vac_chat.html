<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ bot_name }} — Intelligent Enterprise Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background: #f79549; color: #fff; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.2s ease, color 0.2s ease;
    }
    body.theme-dark {
      --bg: #04060e;
      --surface: #0a0c16;
      --surface-2: #070911;
      --border: #1a1c26;
      --text: #e8e8e8;
      --text-strong: #ffffff;
      --muted: #888;
      --muted-2: #555;
      --accent: #f79549;
      --accent-hover: #fe6e00;
      --button-text: #04060e;
      --user-bg: #f79549;
      --user-text: #04060e;
      --user-meta: rgba(4, 6, 14, 0.6);
      --error: #ff2357;
      --typing-dot: #f79549;
      --welcome-text: #555;
      --welcome-copy: #888;
    }
    body.theme-light {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef2f8;
      --border: #d6dbe6;
      --text: #1f2937;
      --text-strong: #0f172a;
      --muted: #667085;
      --muted-2: #94a3b8;
      --accent: #c96a1a;
      --accent-hover: #a35410;
      --button-text: #111827;
      --user-bg: #c96a1a;
      --user-text: #ffffff;
      --user-meta: rgba(255, 255, 255, 0.75);
      --error: #b42318;
      --typing-dot: #c96a1a;
      --welcome-text: #516b85;
      --welcome-copy: #667085;
    }
    header {
      background: var(--surface);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header .logo {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 20px; color: var(--button-text);
    }
    header h1 { font-size: 20px; font-weight: 600; color: var(--text-strong); }
    header .sub { font-size: 12px; color: var(--accent); margin-top: 2px; }
    .container {
      max-width: 800px; margin: 0 auto; width: 100%;
      display: flex; flex-direction: column; height: 100%;
    }
    #chat {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .msg {
      max-width: 80%; padding: 12px 16px; border-radius: 12px;
      line-height: 1.5; white-space: pre-wrap;
      animation: fadeIn 0.25s ease;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }
    .msg .meta {
      font-size: 11px; color: var(--muted-2); margin-top: 6px;
    }
    .msg.bot .meta { color: var(--accent); }
    .msg.user .meta { color: var(--user-meta); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .typing {
      align-self: flex-start; display: flex; gap: 4px; padding: 14px 18px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; border-bottom-left-radius: 4px;
    }
    .typing span {
      width: 8px; height: 8px; background: var(--typing-dot); border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }
    .input-area {
      flex-shrink: 0; padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
    }
    .input-row {
      display: flex; gap: 10px;
      background: var(--surface); border-radius: 12px; padding: 4px;
      border: 1px solid var(--border);
    }
    .input-row input {
      flex: 1; border: none; background: transparent; padding: 12px 16px;
      color: var(--text); font-size: 15px; outline: none;
    }
    .input-row input::placeholder { color: var(--muted-2); }
    .input-row button {
      background: var(--accent); color: var(--button-text); border: none; border-radius: 10px;
      padding: 10px 20px; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background 0.2s;
    }
    .input-row button:hover { background: var(--accent-hover); }
    .input-row button:disabled { background: var(--muted-2); color: var(--text-strong); cursor: not-allowed; }
    .welcome {
      text-align: center; margin: auto; color: var(--welcome-text);
    }
    .welcome h2 { font-size: 22px; color: var(--accent); margin-bottom: 8px; }
    .welcome p { font-size: 14px; line-height: 1.6; color: var(--welcome-copy); }
    .error-msg {
      align-self: center; color: var(--error); font-size: 13px; padding: 8px 16px;
    }
  </style>
</head>
<body class="theme-{{ theme }}">
  <header>
    <div class="logo">B</div>
    <div>
      <h1>{{ bot_name }}</h1>
      <div class="sub">{{ bot_tagline }}</div>
    </div>
  </header>
  <div class="container">
    <div id="chat">
      <div class="welcome" id="welcome">
        <h2>How can {{ bot_name }} help you?</h2>
        <p>Ask me about AI transformation, cloud solutions, ERP,<br>cybersecurity, or any of the enterprise products and services we support.</p>
      </div>
    </div>
    <div class="input-area">
      <form id="form" class="input-row" autocomplete="off">
        <input type="text" id="input" placeholder="Ask a question..." required>
        <button type="submit" id="send">Send</button>
      </form>
    </div>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const welcome = document.getElementById('welcome');

    function addMessage(text, role) {
      welcome?.remove();
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = role === 'bot' ? {{ bot_name|tojson }} : 'You';
      div.appendChild(meta);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typing';
      for (let i = 0; i < 3; i++) div.appendChild(document.createElement('span'));
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      document.getElementById('typing')?.remove();
    }

    function showError(msg) {
      const div = document.createElement('div');
      div.className = 'error-msg';
      div.textContent = msg;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      send.disabled = true;
      addMessage(q, 'user');
      showTyping();
      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q })
        });
        hideTyping();
        if (!res.ok) {
          const err = await res.json();
          showError(err.error || 'Something went wrong.');
          return;
        }
        const data = await res.json();
        const tok = `in:${data.input_tokens} out:${data.output_tokens} total:${data.total_tokens}`;
        addMessage(data.answer + '\n\n—', 'bot');
      } catch (err) {
        hideTyping();
        showError('Network error — check your connection.');
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
