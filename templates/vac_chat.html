<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betopia AI — Intelligent Enterprise Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background: #f79549; color: #fff; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #04060e;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #0a0c16;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #1a1c26;
      flex-shrink: 0;
    }
    header .logo {
      width: 40px; height: 40px;
      background: #f79549;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 20px; color: #04060e;
    }
    header h1 { font-size: 20px; font-weight: 600; color: #fff; }
    header .sub { font-size: 12px; color: #f79549; margin-top: 2px; }
    .container {
      max-width: 800px; margin: 0 auto; width: 100%;
      display: flex; flex-direction: column; height: 100%;
    }
    #chat {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .msg {
      max-width: 80%; padding: 12px 16px; border-radius: 12px;
      line-height: 1.5; white-space: pre-wrap;
      animation: fadeIn 0.25s ease;
    }
    .msg.bot {
      align-self: flex-start;
      background: #0a0c16;
      border: 1px solid #1a1c26;
      border-bottom-left-radius: 4px;
    }
    .msg.user {
      align-self: flex-end;
      background: #f79549;
      color: #04060e;
      border-bottom-right-radius: 4px;
    }
    .msg .meta {
      font-size: 11px; color: #555; margin-top: 6px;
    }
    .msg.bot .meta { color: #f79549; }
    .msg.user .meta { color: rgba(4,6,14,0.6); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .typing {
      align-self: flex-start; display: flex; gap: 4px; padding: 14px 18px;
      background: #0a0c16; border: 1px solid #1a1c26;
      border-radius: 12px; border-bottom-left-radius: 4px;
    }
    .typing span {
      width: 8px; height: 8px; background: #f79549; border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }
    .input-area {
      flex-shrink: 0; padding: 16px 20px 20px;
      border-top: 1px solid #1a1c26;
    }
    .input-row {
      display: flex; gap: 10px;
      background: #0a0c16; border-radius: 12px; padding: 4px;
      border: 1px solid #1a1c26;
    }
    .input-row input {
      flex: 1; border: none; background: transparent; padding: 12px 16px;
      color: #e8e8e8; font-size: 15px; outline: none;
    }
    .input-row input::placeholder { color: #555; }
    .input-row button {
      background: #f79549; color: #04060e; border: none; border-radius: 10px;
      padding: 10px 20px; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background 0.2s;
    }
    .input-row button:hover { background: #fe6e00; }
    .input-row button:disabled { background: #555; color: #999; cursor: not-allowed; }
    .welcome {
      text-align: center; margin: auto; color: #555;
    }
    .welcome h2 { font-size: 22px; color: #f79549; margin-bottom: 8px; }
    .welcome p { font-size: 14px; line-height: 1.6; color: #888; }
    .error-msg {
      align-self: center; color: #ff2357; font-size: 13px; padding: 8px 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">B</div>
    <div>
      <h1>Betopia AI</h1>
      <div class="sub">Intelligent Enterprise Assistant — AI, Cloud & Digital Transformation</div>
    </div>
  </header>
  <div class="container">
    <div id="chat">
      <div class="welcome" id="welcome">
        <h2>How can Betopia help you?</h2>
        <p>Ask me about AI transformation, cloud solutions, ERP,<br>cybersecurity, or any of Betopia's enterprise products and services.</p>
      </div>
    </div>
    <div class="input-area">
      <form id="form" class="input-row" autocomplete="off">
        <input type="text" id="input" placeholder="Ask a question..." required>
        <button type="submit" id="send">Send</button>
      </form>
    </div>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const welcome = document.getElementById('welcome');

    function addMessage(text, role) {
      welcome?.remove();
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = role === 'bot' ? 'Betopia AI' : 'You';
      div.appendChild(meta);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typing';
      for (let i = 0; i < 3; i++) div.appendChild(document.createElement('span'));
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      document.getElementById('typing')?.remove();
    }

    function showError(msg) {
      const div = document.createElement('div');
      div.className = 'error-msg';
      div.textContent = msg;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      send.disabled = true;
      addMessage(q, 'user');
      showTyping();
      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q })
        });
        hideTyping();
        if (!res.ok) {
          const err = await res.json();
          showError(err.error || 'Something went wrong.');
          return;
        }
        const data = await res.json();
        const tok = `in:${data.input_tokens} out:${data.output_tokens} total:${data.total_tokens}`;
        addMessage(data.answer + '\n\n—', 'bot');
      } catch (err) {
        hideTyping();
        showError('Network error — check your connection.');
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
