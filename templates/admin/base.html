<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} — {{ admin_brand_name }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background: #f79549; color: #fff; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      transition: background 0.2s ease, color 0.2s ease;
    }
    body.theme-dark {
      --bg: #04060e;
      --surface: #0a0c16;
      --surface-2: #070911;
      --border: #1a1c26;
      --text: #e8e8e8;
      --text-strong: #ffffff;
      --muted: #888;
      --muted-2: #555;
      --accent: #f79549;
      --accent-hover: #fe6e00;
      --button-text: #04060e;
      --danger: #ff2357;
      --danger-hover: #d01d45;
      --success-bg: #0a1c16;
      --success-text: #6abf8a;
      --success-border: #1a3c26;
      --error-bg: #1c0a0a;
      --error-text: #ff5555;
      --error-border: #3c1a1a;
      --page-ink: #8aaac8;
    }
    body.theme-light {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef2f8;
      --border: #d6dbe6;
      --text: #1f2937;
      --text-strong: #0f172a;
      --muted: #667085;
      --muted-2: #94a3b8;
      --accent: #c96a1a;
      --accent-hover: #a35410;
      --button-text: #111827;
      --danger: #c61f4a;
      --danger-hover: #a6173b;
      --success-bg: #ecf8f1;
      --success-text: #1f7a4f;
      --success-border: #b9e4cd;
      --error-bg: #fdecec;
      --error-text: #b42318;
      --error-border: #f5b5b5;
      --page-ink: #516b85;
    }
    .sidebar {
      width: 240px; background: var(--surface); border-right: 1px solid var(--border);
      padding: 24px 0; flex-shrink: 0; display: flex; flex-direction: column;
    }
    .sidebar .brand {
      padding: 0 20px 24px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
    }
    .sidebar .brand h2 { font-size: 16px; color: var(--text-strong); }
    .sidebar .brand small { font-size: 11px; color: var(--accent); }
    .sidebar a {
      display: block; padding: 10px 20px; color: var(--muted); text-decoration: none;
      font-size: 14px; transition: background 0.15s;
    }
    .sidebar a:hover, .sidebar a.active { background: var(--border); color: var(--text-strong); }
    .sidebar a.active { border-left: 3px solid var(--accent); }
    .sidebar .logout-form { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
    .sidebar .logout {
      width: 100%; background: transparent; border: 0; text-align: left;
      padding: 10px 20px; color: var(--muted); font: inherit; cursor: pointer;
    }
    .sidebar .logout:hover { background: var(--border); color: var(--text-strong); }
    .main { flex: 1; padding: 32px 40px; overflow-y: auto; max-width: 960px; }
    .main h1 { font-size: 22px; margin-bottom: 24px; color: var(--text-strong); }
    .flash { padding: 10px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
    .flash.success { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
    .flash.error { background: var(--error-bg); color: var(--error-text); border: 1px solid var(--error-border); }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 20px;
    }
    .card h3 { font-size: 15px; color: var(--accent); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input, textarea, select {
      width: 100%; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 14px; outline: none; transition: border-color 0.2s; font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { min-height: 100px; resize: vertical; }
    .form-group { margin-bottom: 16px; }
    .btn {
      padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.2s; display: inline-block; text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: var(--button-text); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-sm { padding: 6px 14px; font-size: 12px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; text-align: center; }
    .stat .num { font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat .label { font-size: 12px; color: var(--muted-2); margin-top: 4px; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted-2); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    td { color: var(--text); }
    .empty { text-align: center; padding: 40px; color: var(--muted-2); font-size: 14px; }
    .inline-form { display: inline; }
  </style>
</head>
<body class="theme-{{ admin_theme }}">
  <nav class="sidebar">
    <div class="brand">
      <h2>{{ admin_brand_name }} Admin</h2>
      <small>Configuration Panel</small>
    </div>
    <a href="{{ url_for('admin.dashboard') }}" class="{% if request.endpoint == 'admin.dashboard' %}active{% endif %}">Dashboard</a>
    <a href="{{ url_for('admin.settings') }}" class="{% if request.endpoint == 'admin.settings' %}active{% endif %}">Bot Settings</a>
    <a href="{{ url_for('admin.knowledge') }}" class="{% if request.endpoint == 'admin.knowledge' %}active{% endif %}">Knowledge Base</a>
    <form class="logout-form" method="POST" action="{{ url_for('admin.logout') }}">
      <button type="submit" class="logout">Logout</button>
    </form>
  </nav>
  <div class="main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
