<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} — Betopia AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background: #f79549; color: #fff; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #04060e;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
    }
    .sidebar {
      width: 240px; background: #0a0c16; border-right: 1px solid #1a1c26;
      padding: 24px 0; flex-shrink: 0; display: flex; flex-direction: column;
    }
    .sidebar .brand {
      padding: 0 20px 24px; border-bottom: 1px solid #1a1c26; margin-bottom: 8px;
    }
    .sidebar .brand h2 { font-size: 16px; color: #fff; }
    .sidebar .brand small { font-size: 11px; color: #f79549; }
    .sidebar a {
      display: block; padding: 10px 20px; color: #888; text-decoration: none;
      font-size: 14px; transition: background 0.15s;
    }
    .sidebar a:hover, .sidebar a.active { background: #1a1c26; color: #fff; }
    .sidebar a.active { border-left: 3px solid #f79549; }
    .sidebar .logout { margin-top: auto; padding-top: 16px; border-top: 1px solid #1a1c26; }
    .main { flex: 1; padding: 32px 40px; overflow-y: auto; max-width: 960px; }
    .main h1 { font-size: 22px; margin-bottom: 24px; color: #fff; }
    .flash { padding: 10px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
    .flash.success { background: #0a1c16; color: #6abf8a; border: 1px solid #1a3c26; }
    .flash.error { background: #1c0a0a; color: #ff5555; border: 1px solid #3c1a1a; }
    .card {
      background: #0a0c16; border: 1px solid #1a1c26; border-radius: 10px; padding: 24px; margin-bottom: 20px;
    }
    .card h3 { font-size: 15px; color: #f79549; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
    label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
    input, textarea, select {
      width: 100%; padding: 10px 12px; background: #04060e; border: 1px solid #1a1c26; border-radius: 8px;
      color: #e8e8e8; font-size: 14px; outline: none; transition: border-color 0.2s; font-family: inherit;
    }
    input:focus, textarea:focus { border-color: #f79549; }
    textarea { min-height: 100px; resize: vertical; }
    .form-group { margin-bottom: 16px; }
    .btn {
      padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.2s; display: inline-block; text-decoration: none;
    }
    .btn-primary { background: #f79549; color: #04060e; }
    .btn-primary:hover { background: #fe6e00; }
    .btn-danger { background: #ff2357; color: #fff; }
    .btn-danger:hover { background: #d01d45; }
    .btn-sm { padding: 6px 14px; font-size: 12px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat { background: #0a0c16; border: 1px solid #1a1c26; border-radius: 10px; padding: 20px; text-align: center; }
    .stat .num { font-size: 28px; font-weight: 700; color: #f79549; }
    .stat .label { font-size: 12px; color: #555; margin-top: 4px; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #1a1c26; }
    th { color: #555; font-weight: 600; font-size: 12px; text-transform: uppercase; }
    td { color: #e8e8e8; }
    .empty { text-align: center; padding: 40px; color: #555; font-size: 14px; }
    .inline-form { display: inline; }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="brand">
      <h2>Betopia AI Admin</h2>
      <small>Configuration Panel</small>
    </div>
    <a href="{{ url_for('admin.dashboard') }}" class="{% if request.endpoint == 'admin.dashboard' %}active{% endif %}">Dashboard</a>
    <a href="{{ url_for('admin.settings') }}" class="{% if request.endpoint == 'admin.settings' %}active{% endif %}">Bot Settings</a>
    <a href="{{ url_for('admin.knowledge') }}" class="{% if request.endpoint == 'admin.knowledge' %}active{% endif %}">Knowledge Base</a>
    <a class="logout" href="{{ url_for('admin.logout') }}">Logout</a>
  </nav>
  <div class="main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
