{% extends "admin/base.html" %}
{% block title %}Edit Tenant{% endblock %}
{% block content %}
<h1>Edit Tenant</h1>
<div class="card">
  <form method="POST">
    <div class="form-group">
      <label>Tenant Name</label>
      <input name="name" value="{{ tenant.name }}" required>
    </div>
    <div class="form-group">
      <label>Slug</label>
      <input value="{{ tenant.slug }}" disabled style="opacity:0.6;">
    </div>
    <div class="form-group">
      <label>Status</label>
      <input value="{{ tenant.status }}" disabled style="opacity:0.6;">
    </div>
    <button class="btn btn-primary">Save</button>
    <a class="btn" href="{{ url_for('admin.tenants') }}" style="background:var(--surface-2);color:var(--text);">Cancel</a>
  </form>
</div>
{% endblock %}
