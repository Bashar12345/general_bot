{% extends "admin/base.html" %}
{% block title %}Edit Tenant{% endblock %}
{% block content %}
<h1>Edit Tenant</h1>
<div class="card">
  <form method="POST">
    <div class="form-group">
      <label>Tenant Name</label>
      <input name="name" value="{{ tenant.name }}" required>
    </div>
    <div class="form-group">
      <label>Slug</label>
      <input value="{{ tenant.slug }}" disabled style="opacity:0.6;">
    </div>
    <div class="form-group">
      <label>Status</label>
      <input value="{{ tenant.status }}" disabled style="opacity:0.6;">
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><polyline points="20 6 9 17 4 12"/></svg> Save</button>
      <a class="btn btn-ghost" href="{{ url_for('admin.tenants') }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
