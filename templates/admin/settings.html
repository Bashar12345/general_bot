{% extends "admin/base.html" %}
{% block title %}Bot Settings{% endblock %}
{% block content %}
<h1>Bot Settings</h1>

<div class="card">
  <form method="POST">
    <div class="form-group">
      <label>Bot Name</label>
      <input type="text" name="bot_name" value="{{ settings.bot_name }}" placeholder="VALR-Bot">
    </div>
    <div class="form-group">
      <label>Personality</label>
      <input type="text" name="personality" value="{{ settings.personality }}" placeholder="e.g., a warm, veteran-owned assistant from VALR">
    </div>
    <div class="form-group">
      <label>Tone</label>
      <textarea name="tone" placeholder="e.g., battle-buddy style: short, clear, caring. Use 'we', 'you', 'I got you'.">{{ settings.tone }}</textarea>
    </div>
    <div class="form-group">
      <label>Purpose / Use Case</label>
      <textarea name="purpose" placeholder="e.g., VALR is a veteran-owned organization dedicated to simplifying the VA process.">{{ settings.purpose }}</textarea>
    </div>
    <div class="form-group">
      <label>Instructions / Fallback Message</label>
      <textarea name="instructions" rows="4" placeholder="What to say when the bot doesn't know the answer.">{{ settings.instructions }}</textarea>
    </div>
    <button class="btn btn-primary">Save Settings</button>
  </form>
</div>
{% endblock %}
