<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Account{% endblock %} — {{ admin_brand_name }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f6fb;
      --panel: rgba(255, 255, 255, 0.84);
      --panel-strong: #ffffff;
      --border: #d8deea;
      --text: #162033;
      --muted: #667085;
      --accent: #c96a1a;
      --accent-hover: #a35410;
      --button-text: #111827;
      --shadow: 0 24px 80px rgba(17, 24, 39, 0.10);
    }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(201, 106, 26, 0.12), transparent 28%),
        radial-gradient(circle at bottom right, rgba(22, 32, 51, 0.10), transparent 32%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .shell {
      width: min(100%, 460px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .mark {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), #d98325);
      color: var(--button-text);
      display: grid;
      place-items: center;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: var(--shadow);
    }
    .brand h1 { font-size: 22px; margin-bottom: 2px; }
    .brand p { color: var(--muted); font-size: 13px; }
    .card {
      background: var(--panel);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
    }
    .flash {
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 14px;
      border: 1px solid transparent;
    }
    .flash.success { background: #eef8f0; color: #1f7a4f; border-color: #c8e6d1; }
    .flash.error { background: #fef0f0; color: #b42318; border-color: #f5c2c7; }
    h2 { font-size: 26px; margin-bottom: 18px; }
    label { display:block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel-strong);
      color: var(--text);
      font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(201, 106, 26, 0.12); }
    .form-group { margin-bottom: 16px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      background: var(--accent);
      color: var(--button-text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: var(--accent-hover); }
    .helper {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .helper a { color: var(--accent); text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="mark">{{ admin_brand_name[:2]|upper }}</div>
      <div>
        <h1>{{ admin_brand_name }}</h1>
        <p>Tenant account access</p>
      </div>
    </div>
    <div class="card">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
