<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Account{% endblock %} — {{ admin_brand_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="mark">{{ admin_brand_name[:2]|upper }}</div>
      <div>
        <h1>{{ admin_brand_name }}</h1>
        <p>Tenant account access</p>
      </div>
    </div>
    <div class="card">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
